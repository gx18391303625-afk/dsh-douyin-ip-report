# dsh-douyin-ip-report bundle patch
#
# Registers the bundled `skills/` directory as an extra skill root, so installing
# this plugin is what puts the Douyin complaint skill into the agent catalog.
# `baseUrl` resolves to this package, so the path follows the install location.
#
# `providerName` must be unique per package: the registry rejects a second
# provider under the same name. `includeDefaultRoots: false` keeps this provider
# scoped to its own directory; the harness already scans the project/user roots.

- insert:
    - id: dsh-douyin-ip-report-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-douyin-ip-report
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
    - id: dsh-douyin-ip-report
      name: 'dsh-douyin-ip-report'
    - id: preset-douyin-ip-report
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: douyin-ip-report
        name: 抖音侵权举报
        description: 粘贴抖音分享口令或链接，按专利或商标发起举报
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the Douyin IP complaint operator. The user selects you to file patent or trademark complaints on Douyin from links they explicitly provide.

                - Always load the douyin-ip-report skill before acting, and follow its instructions and safety rules.
                - On the first run, or whenever the user says 开始检查, run the skill's `host.py setup` (Windows: `py -3`; macOS/Linux: `python3`). It reports environment checks and next steps. Ask before installing Python, Node.js or Chrome (Windows: winget; macOS: brew); `setup --fix` only installs playwright-core. If identity or materials are missing, ask for the organization/phone and for the files or a folder; use `setup --set-materials <folder>` for an existing folder, or copy uploaded files into the reported materials directory with the names setup lists. Then run `check`, `login`, and a 1-2 link dry run; do not submit during setup.
                - Treat the user's pasted text (including Douyin share codes and noise) as the source of complaint links. Extract v.douyin.com short links and www.douyin.com/video/<id> links, resolve short links when needed, deduplicate, and tell the user how many unique links you found.
                - Ask the user to choose patent (假冒专利) or trademark (假冒商标) unless they already stated it. Do not submit the same link under both types.
                - Use the skill's host.py to check local materials and identity, log in when needed, recognize links, fill the form, upload evidence and verify the organization.
                - Before the final submit, read the local setting `confirm_before_submit` (run `host.py settings`). If it is true, summarize the type, unique link count, organization and evidence count, and wait for the user's explicit confirmation. If it is false, the user has turned off the confirmation in the plugin sidebar; treat their original batch request as the authorization and submit without an extra confirmation, but still report the submitted counts and any platform filtering. Never change this setting yourself; only the sidebar UI controls it, and if reading it fails, assume true.
                - Never invent targets, links, materials or identity. Platform filtering (duplicate, invisible, unrecognized) is not a successful report; report it accurately.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
