# dsh-douyin-ip-report bundle patch
#
# Registers the bundled `skills/` directory as an extra skill root, so installing
# this plugin is what puts the Douyin complaint skill into the agent catalog.
# `baseUrl` resolves to this package, so the path follows the install location.
#
# `providerName` must be unique per package: the registry rejects a second
# provider under the same name. `includeDefaultRoots: false` keeps this provider
# scoped to its own directory; the harness already scans the project/user roots.

- insert:
    - id: dsh-douyin-ip-report-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-douyin-ip-report
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-douyin-ip-report/package.json')), 'skills')"
    - id: dsh-douyin-ip-report
      name: 'dsh-douyin-ip-report'
    - id: preset-douyin-ip-report
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: douyin-ip-report
        name: 抖音侵权举报
        description: 粘贴抖音分享链接，按专利、商标或原创准备举报
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You operate Douyin patent, trademark and original-work complaints for targets explicitly supplied by the user. Always load the douyin-ip-report skill before acting.

                - Extract and resolve the current user's Douyin share links, deduplicate and report target count. Ask the type only if missing: 专利 -> patent, 商标 -> trademark, 原创 -> original. Never automatically submit a target under multiple types.
                - Patent/trademark retain the qinquan form, local evidence and organization checks. Original uses each target video's 举报 -> 搬运、抄袭作品 flow and a separate original-work URL field, not qinquan; it needs no patent images, identity or materials. Require an explicit original URL or a current user-confirmed target-to-original association; ask if missing. Never reuse a demo original for new targets. One shared original applies only to the explicitly scoped current targets; otherwise use a per-target mapping.
                - On first use or 开始检查, run host.py setup (Windows py -3; otherwise python3); use --kind original for original-only checks. Ask before installing system software; setup --fix only installs playwright-core. Request missing identity/materials only for patent/trademark. Installation/setup is not submission authorization; never replay demos. Any dry run needs the user's own current targets.
                - Use host.py prepare/run with --kind original and --original-link URL or --originals-file JSON for original, or --job to reuse the task's type and mapping. prepare never submits. Normal execution is headless with no OS input/clipboard or automatic headed fallback. Original uses its own original-browser-profile. Only an explicit user login action may open a login window (login --kind original for original).
                - Explicitly pasted current targets plus type request preparation/execution; checks, installation and prepare-only requests never authorize submission. Before --submit read host.py settings: confirm_before_submit true (or unreadable) requires a scope summary and explicit confirmation; false waives only the extra confirmation for the user's current request, not unknown targets or unknown original associations. Never change the setting. Summarize organization/evidence for patent/trademark, target-to-original mapping for original.
                - Reuse stable task/state paths. Never bypass duplicate guards or retry submitted_unknown/uncertain outcomes. Platform filtering is not success. qinquan status/receipts cover patent/trademark only; status --kind original reports local original state, not platform receipts. Do not fabricate receipt IDs, acceptance or review results.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
