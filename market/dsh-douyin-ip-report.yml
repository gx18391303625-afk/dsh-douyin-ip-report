description:
  en: "v0.8.0: Douyin patent, trademark and original-work complaints for DeepSeek Harness, plus a creator-discovery skill. Report jobs take explicit targets; patent/trademark use local evidence and organization identity, original-work reports require explicit target-to-original URL mappings. A dedicated headless profile handles submission without OS mouse, keyboard or clipboard input; qinquan history covers patent/trademark, original-work state stays local-only. v0.8.0 adds find-douyin-ip-links (search a creator's commerce-rota videos, compare real frames against your product and original references, export discovery/targets/mapping files) and a stdlib-only family clustering script that folds re-uploaded copies of the same clip into one family so each family needs one visual check; families confirmed as irrelevant can be remembered locally and skipped later. Clustering was validated on 87 real videos that collapsed into 11 families. Only duration overlap, without a frame hash or title match, is never auto-skipped. Review outcomes remain unknown; no unauthorized submission."
  zh: "v0.8.0：抖音专利/商标/原创举报 + 达人线索发现。举报只处理明确提供的目标：专利/商标用本机材料与组织身份，原创需明确的目标→原创链接映射；独立 profile 无头执行，不用系统鼠标、键盘、剪贴板。qinquan 只反映专利/商标，原创仅本地状态。v0.8.0 新增 find-douyin-ip-links（按达人检索电商罗盘视频、用实际画面比对自家产品与原创参考、导出线索清单与原创映射），并附带纯标准库素材族聚类脚本：把同一段素材的重复投稿折叠成一族，每族只需核对 1 条；已判定无关的素材族可存本地，下次直接跳过。聚类在 87 条真实视频上验证，收敛为 11 族。仅有同长度、没有帧哈希或标题佐证时不会自动跳过。审核结果未知，未授权不提交。"
